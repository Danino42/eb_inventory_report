# Pings the backend every 10 minutes, so Render's free plan never puts it to sleep (a sleeping
# server needs about a minute to answer the tablet). The server also pings itself
# (backend/app/services/keep_awake.py); this is the outside safety net, e.g. right after a restart.
# GitHub may start scheduled runs a few minutes late.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --fail --silent --show-error --max-time 120 https://eb-inventory-backend-op64.onrender.com/api/health
